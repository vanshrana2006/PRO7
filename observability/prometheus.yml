# Prometheus scrape config for AI ResearchOS.
#
# WRITTEN TO PRODUCTION STANDARD, NOT EXECUTED IN THIS SANDBOX (no
# Prometheus instance available here). The metric names below match
# exactly what app/core/metrics_registry.py emits -- verify with:
#   curl http://localhost:8000/metrics
# before wiring this into a real Prometheus deployment.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ai-researchos-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]  # use the actual host:port in your deployment
        labels:
          service: "ai-researchos-backend"
