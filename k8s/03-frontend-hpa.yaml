apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: researchos-frontend-hpa
  namespace: ai-researchos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: researchos-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
