name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run offline unit tests (pure logic)
        working-directory: backend
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Byte-compile all modules (catches syntax/import errors)
        working-directory: backend
        run: python3 -m py_compile $(find app -name "*.py") scripts/*.py

  backend-integration:
    name: Backend integration (live network calls)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          mkdir -p data/pdfs

          nohup uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > backend.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health; then
              echo "Backend started."
              break
            fi
            sleep 1
          done

      - name: Health check
        run: |
          curl -i http://localhost:8000/api/health

      - name: Live arXiv search
        run: |
          curl -v \
            "http://localhost:8000/api/papers/search?q=graph+neural+networks&max_results=2"

      - name: Full ingest + extraction pipeline
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST http://localhost:8000/api/papers/ingest \
            -H "Content-Type: application/json" \
            -d '{"arxiv_id":"1609.02907"}')

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "======================================"
          echo "HTTP STATUS: $STATUS"
          echo "======================================"
          echo "$BODY"
          echo "======================================"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Ingest endpoint failed."
            exit 1
          fi

          PAPER_ID=$(echo "$BODY" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['paper_id'])")

          echo "Paper ID: $PAPER_ID"

          curl -v -X POST \
            "http://localhost:8000/api/knowledge/extract/$PAPER_ID"

      - name: BM25 corpus search over ingested papers
        run: |
          curl -v \
            "http://localhost:8000/api/papers/corpus-search?q=graph+convolutional&top_k=5"

      - name: Show backend logs on failure
        if: failure()
        working-directory: backend
        run: |
          echo "========== BACKEND LOG =========="
          cat backend.log

  frontend-build:
    name: Frontend build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
